server:
  port: 9889
  shutdown: graceful
  tomcat:
    # 线程配置
    threads:
      max: 64  # 最大工作线程数
      min-spare: 16  # 最小空闲线程数
    # 连接配置
    max-connections: 2000  # 最大连接数
    accept-count: 500  # 等待队列大小
    connection-timeout: 30000  # 连接超时(ms)
    keep-alive-timeout: 30000  # Keep-Alive 超时
    max-keep-alive-requests: 100
    max-swallow-size: 500MB  # 请求体最大大小
    max-http-form-post-size: 500MB
    remoteip:
      remote-ip-header: X-Forwarded-For
      protocol-header: X-Forwarded-Proto
  max-http-request-header-size: 16KB
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://192.168.31.99:3306/strix?useSSL=true&serverTimezone=Asia/Shanghai&autoReconnect=true&rewriteBatchedStatements=true
    username: root
    password: AnAn@8899#
    hikari:
      pool-name: HikariCP
      minimum-idle: 10
      maximum-pool-size: 20
      connection-timeout: 5000
      idle-timeout: 300000
      max-lifetime: 1800000
      connection-test-query: SELECT 1
      initialization-fail-timeout: 1
  data:
    redis:
      database: 0
      host: 127.0.0.1
      port: 6379
      password:
      lettuce:
        shutdown-timeout: 200ms
        pool:
          max-active: 16
          max-idle: 4
          min-idle: 2
          max-wait: 5000ms
# 生产环境禁用 API 文档
springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false
knife4j:
  production: true
