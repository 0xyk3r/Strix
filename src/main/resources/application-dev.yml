server:
  port: 9889
  shutdown: immediate
  tomcat:
    # 线程配置
    threads:
      max: 32  # 最大工作线程数
      min-spare: 4  # 最小空闲线程数
    # 连接配置
    max-connections: 2000  # 最大连接数
    accept-count: 200  # 等待队列大小
    connection-timeout: 30000  # 连接超时(ms)
    keep-alive-timeout: 30000  # Keep-Alive 超时
    max-keep-alive-requests: 100
    max-swallow-size: 500MB  # 请求体最大大小
    max-http-form-post-size: 500MB
    remoteip:
      remote-ip-header: X-Forwarded-For
      protocol-header: X-Forwarded-Proto
  max-http-request-header-size: 16KB
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://192.168.31.99:3306/strix?useSSL=true&serverTimezone=Asia/Shanghai&autoReconnect=true&rewriteBatchedStatements=true
    username: root
    password: AnAn@8899#
    hikari:
      pool-name: HikariCP
      minimum-idle: 2
      maximum-pool-size: 10
      connection-timeout: 5000
      idle-timeout: 300000
      max-lifetime: 1800000
      connection-test-query: SELECT 1
      initialization-fail-timeout: 1
  data:
    redis:
      database: 0
      host: 192.168.31.99
      port: 6379
      password: str1Xredis
      lettuce:
        shutdown-timeout: 200ms
        pool:
          max-active: 4
          max-idle: 2
          min-idle: 1
          max-wait: 5000ms
# api-docs
springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: order
  api-docs:
    enabled: true
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: cn.projectan
  default-flat-param-object: true
  override-with-generic-response: false
knife4j:
  basic:
    enable: true
    username: strix
    password: ProjectAn#@#2025
  setting:
    language: zh_cn
    enable-footer-custom: true
    footer-custom-content: Copyright 2025 - ProjectAn
