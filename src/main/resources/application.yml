spring:
  profiles:
    active: dev
  application:
    name: Strix
  lifecycle:
    timeout-per-shutdown-phase: 30s
  threads:
    virtual:
      enabled: true
  servlet:
    multipart:
      enabled: true
      file-size-threshold: 0
      max-file-size: 512MB
      max-request-size: 512MB
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
    default-property-inclusion: non_null
  mvc:
    async:
      request-timeout: 300000
    static-path-pattern: /statics/**
    format:
      date: yyyy-MM-dd
      date-time: yyyy-MM-dd HH:mm:ss
    servlet:
      load-on-startup: 1
  web:
    resources:
      add-mappings: true
  messages:
    basename: i18n/strix
    encoding: UTF-8
    fallback-to-system-locale: false
server:
  forward-headers-strategy: framework
# mybatis
mybatis-plus:
  # 实体扫描路径, 多个 package 使用,或;分隔
  typeAliasesPackage: cn.projectan.**.model.db
  global-config:
    db-config:
      # 逻辑删除配置
      logic-delete-field: deleted_status
      logic-delete-value: 1
      logic-not-delete-value: 0
      # 主键类型
      id-type: assign_id
      # 字段验证策略
      insert-strategy: not_empty
      update-strategy: not_empty
    banner: false
  configuration:
    # 开启自动驼峰命名规则映射
    map-underscore-to-camel-case: true
    cache-enabled: true
    call-setters-on-nulls: true
# strix
strix:
  instance-id: ${random.uuid}
  # AI 文件预览签名密钥
  ai:
    preview-sign-secret: strix-ai-file-preview
  # strix 模块开关
  module:
    sms: true
    oss: true
    job: true
    oauth: true
    push: true
    pay: true
    ai: true
  # 控制台输出原始请求内容
  show-request: false
  # 控制台输出原始响应内容
  show-response: false
  # log 持久化配置
  log:
    enable: true
  # strix 验证码配置
  captcha:
    type: block_puzzle
    cache-type: redis
    aes-status: true
    water-mark: Strix
    interference-options: 1
    req-frequency-limit-enable: true
    req-get-lock-limit: 5
    req-get-lock-seconds: 300
    req-get-minute-limit: 20
  # strix 验证码计次器配置
  verifier-counter:
    sms:
      limit: 5
      seconds: 300
    email:
      limit: 5
      seconds: 300
  # strix 默认语言
  default-locale: zh_CN
  # CORS 跨域配置
  cors:
    allowed-origins:
      - "*"
  # API 速率限制配置
  rate-limit:
    enabled: true
    default-limit: 600
    default-window: 60
  # 包扫描路径
  package-scan:
    job:
    model:
  # 延迟任务配置
  delayed-task:
    enabled: true
    batch-size: 100
